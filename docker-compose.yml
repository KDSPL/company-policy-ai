services:
  postgres: #postgresql db
    image: pgvector/pgvector:pg16
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: company_policy_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d company_policy_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama: #ollama server
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  web: #nextjs (development)
    build:
      context: .
      dockerfile: Dockerfile
    container_name: company_policy_web
    ports:
      - "3000:3000"
      - "5555:5555"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
      - AUTH_SECRET=${AUTH_SECRET}
      - CHAT_MODEL=${CHAT_MODEL}
      - NODE_ENV=development
      - EMBEDDING_MODEL=${EMBEDDING_MODEL}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - ADMIN_EMAILS=${ADMIN_EMAILS}
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started

  #uncomment the following code to test a build locally 
  # web-prod: #nextjs (production build testing in local)
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.prod
  #   container_name: company_policy_web_prod
